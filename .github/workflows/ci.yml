name: CI

# PR·push 에서 검증(자격증명 불필요)을 돌리고,
# 배포는 OIDC 역할이 설정돼 있을 때만(수동 트리거 또는 main push) 수행한다.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 검증: 자격증명 없이 pytest + jest + cdk synth ───────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Python unit tests
        run: python -m pytest backend/tests/ -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infra deps
        working-directory: backend/infra
        run: npm ci || npm install

      - name: Build + CDK assertions
        working-directory: backend/infra
        run: |
          npm run build
          npx jest

      - name: CDK synth (no credentials)
        working-directory: backend/infra
        run: npx cdk synth --all

  # ── 배포: OIDC 역할이 있을 때만 (액세스 키 사용 안 함) ──────
  # secrets.AWS_DEPLOY_ROLE_ARN 이 설정돼 있어야 실행된다.
  # main push 또는 수동 트리거에서만 동작.
  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 토큰 발급
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Guard — OIDC 역할 ARN 필요
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN 시크릿이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.skip == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Set up Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infra deps
        if: steps.guard.outputs.skip == 'false'
        working-directory: backend/infra
        run: npm ci || npm install

      - name: CDK deploy
        if: steps.guard.outputs.skip == 'false'
        working-directory: backend/infra
        run: |
          npm run build
          npx cdk deploy --all --require-approval never
