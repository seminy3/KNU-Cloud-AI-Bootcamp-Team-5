name: Frontend build

on:
  push:
    branches: [main, frontend]
    paths: ['frontend/**', '.github/workflows/frontend-build.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      VITE_AWS_REGION: ap-northeast-2
      VITE_COGNITO_IDENTITY_POOL_ID: ${{ vars.VITE_COGNITO_IDENTITY_POOL_ID }}
      VITE_POSE_MODEL_URL: ${{ vars.VITE_POSE_MODEL_URL }}
      VITE_HAND_MODEL_URL: ${{ vars.VITE_HAND_MODEL_URL }}
      VITE_MOCK_PEER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check deployment configuration
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module -e '
            const url = process.env.VITE_WS_URL || "";
            const pool = process.env.VITE_COGNITO_IDENTITY_POOL_ID || "";
            if (!url.startsWith("wss://") || !pool.startsWith("ap-northeast-2:")) {
              throw new Error("Set repository variables VITE_WS_URL (wss://) and VITE_COGNITO_IDENTITY_POOL_ID before exporting a deployment artifact.");
            }
          '
      - name: Upload dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signmed-frontend-dist-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  # main에 프론트 변경이 합쳐지면 S3에 올리고 CloudFront 캐시를 비운다.
  # 저장소 변수 FRONTEND_DEPLOY_ROLE_ARN, WEBAPP_BUCKET, WEBAPP_DISTRIBUTION_ID가 있어야 동작한다.
  # 역할은 SignMedCicdOidcStack의 signmed-github-frontend-deploy (main 브랜치 push 전용, 업로드·캐시 무효화 권한만).
  deploy:
    needs: build
    # main push 또는 main에서 수동 실행(Actions → Frontend build → Run workflow)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.FRONTEND_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency: frontend-deploy
    env:
      BUCKET: ${{ vars.WEBAPP_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.WEBAPP_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signmed-frontend-dist-${{ github.sha }}
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html --exclude '*.wasm' --exclude '*.task'
          aws s3 sync dist "s3://$BUCKET" --exclude '*' --include '*.wasm' --content-type application/wasm
          aws s3 sync dist "s3://$BUCKET" --exclude '*' --include '*.task' --content-type application/octet-stream
          # index.html은 매번 새로 받게 해서 새 빌드가 바로 보이게 한다
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control no-cache
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'

