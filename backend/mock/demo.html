<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SignMed 백엔드 동작 확인</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #1f2937; }
  h1 { font-size: 22px; }
  .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  input { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 14px; font-size: 14px; cursor: pointer; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; }
  button.secondary { background: #fff; color: #2563eb; }
  button:disabled { opacity: .4; cursor: default; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin: 12px 0; }
  .words span { display: inline-block; background: #eef2ff; border-radius: 4px; padding: 4px 8px; margin: 2px; }
  .sentence { font-size: 28px; font-weight: 700; margin: 8px 0; }
  .status { font-size: 13px; color: #6b7280; }
  pre { background: #f9fafb; padding: 10px; font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  .ok { color: #059669; } .err { color: #dc2626; }
</style>
</head>
<body>
<h1>SignMed 백엔드 동작 확인 (흐름 ① 수어 → 음성·자막)</h1>
<p class="status">배포된 WebSocket에 실제로 붙습니다. 좌표는 팀 val 클립(test_1~3.json)을 그대로 보냅니다. 카메라는 쓰지 않습니다.</p>

<div class="row">
  <input id="url" placeholder="wss://xxxx.execute-api.ap-northeast-2.amazonaws.com/dev">
  <button id="connect">연결</button>
</div>
<div class="status" id="conn">연결 안 됨</div>

<div class="card">
  <b>1. 수어 단어 인식 (recognize)</b>
  <div class="row">
    <button class="secondary" data-file="test_1.json" disabled>test_1 보내기 (정답: 아프다)</button>
    <button class="secondary" data-file="test_2.json" disabled>test_2 보내기 (정답: 설사)</button>
    <button class="secondary" data-file="test_3.json" disabled>test_3 보내기 (정답: 상처/다치다)</button>
  </div>
  <div>누적된 단어: <span class="words" id="words">없음</span></div>
</div>

<div class="card">
  <b>2. 문장 확정 (finalize)</b>
  <div class="row"><button id="finalize" disabled>문장 만들기 + 음성</button></div>
  <div class="sentence" id="sentence"></div>
  <audio id="audio" controls style="width:100%; display:none"></audio>
  <div class="status" id="confirm"></div>
</div>

<div class="card">
  <b>서버 응답 로그</b>
  <pre id="log"></pre>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sessionId = "demo-" + Math.random().toString(36).slice(2, 8);
let ws = null;
const cache = {};
// ?url=wss://... 로 열면 주소를 미리 채운다
$("url").value = new URLSearchParams(location.search).get("url") || "";

function log(obj, cls) {
  const line = (typeof obj === "string" ? obj : JSON.stringify(obj, null, 2));
  const el = document.createElement("div");
  if (cls) el.className = cls;
  el.textContent = new Date().toLocaleTimeString() + "  " + line;
  $("log").prepend(el);
}

function setEnabled(on) {
  document.querySelectorAll("button[data-file]").forEach(b => b.disabled = !on);
  $("finalize").disabled = !on;
}

$("connect").onclick = () => {
  const url = $("url").value.trim();
  if (!url) return alert("WebSocket URL을 넣어 주세요");
  ws = new WebSocket(url);
  $("conn").textContent = "연결 중...";
  ws.onopen = () => { $("conn").innerHTML = '<span class="ok">연결됨</span> · sessionId=' + sessionId; setEnabled(true); };
  ws.onclose = () => { $("conn").textContent = "연결 끊김"; setEnabled(false); };
  ws.onerror = () => log("WebSocket 오류", "err");
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    log(msg, msg.type === "error" ? "err" : "ok");
    if (msg.type === "word") {
      $("words").innerHTML = msg.words.map(w => "<span>" + w + "</span>").join("");
    } else if (msg.type === "speech") {
      $("sentence").textContent = msg.sentence || "(빈 문장)";
      $("words").textContent = "없음 (finalize 후 비움)";
      if (msg.audioUrl) { const a = $("audio"); a.src = msg.audioUrl; a.style.display = "block"; a.play().catch(() => {}); }
      $("confirm").textContent = msg.needsConfirm ? "⚠ 확인 필요 (모호하거나 음성 실패)" : "";
    }
  };
};

document.querySelectorAll("button[data-file]").forEach(btn => {
  btn.onclick = async () => {
    const f = btn.dataset.file;
    if (!cache[f]) cache[f] = (await (await fetch("../../" + f)).json()).keypoints;
    log("recognize 전송: " + f + " (첫 호출은 콜드 스타트로 10초 정도 걸릴 수 있음)");
    ws.send(JSON.stringify({ action: "recognize", sessionId, keypoints: cache[f] }));
  };
});

$("finalize").onclick = () => {
  log("finalize 전송");
  ws.send(JSON.stringify({ action: "finalize", sessionId }));
};
</script>
</body>
</html>
